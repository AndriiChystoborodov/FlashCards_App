display_information:
  name: Retain Dev
  description: Dev app for Retain (Socket Mode)
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Retain Dev
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
