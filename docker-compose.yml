# Local Postgres (decisions 0023, 0024). Host port 5433: 5432 is often taken.
# Tests:    TEST_DATABASE_URL=postgres://retain:retain@localhost:5433/retain_test
# Scenario: DATABASE_URL=postgres://retain:retain@localhost:5433/retain_dev (created by `npm run db:reset`;
#           init scripts only run on the first volume init, so the reset script creates it).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: retain
      POSTGRES_PASSWORD: retain
      POSTGRES_DB: retain_test
    ports:
      - "5433:5432"
